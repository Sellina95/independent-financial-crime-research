<script>
const all=JSON.parse(document.getElementById("data").textContent);
const q=document.getElementById("q");
const s=document.getElementById("status");
const a=document.getElementById("asset");
const box=document.getElementById("items");
const more=document.getElementById("more");
const count=document.getElementById("count");

for(const v of [...new Set(all.map(x=>x.asset))].sort()){
 const o=document.createElement("option");
 o.value=v;o.textContent=v;a.append(o);
}
let filtered=[],shown=0;
function el(tag,cls,txt){
 const n=document.createElement(tag);
 if(cls)n.className=cls;
 if(txt!==undefined)n.textContent=txt;
 return n;
}
function abbr(v){
 return v.length>24?v.slice(0,10)+"…"+v.slice(-6):v;
}
function append(){
 const batch=filtered.slice(shown,shown+100);
 for(const r of batch){
  const card=el("div","card");
  const top=el("div","top");
  top.append(el("span","",
    r.utc?r.utc+" UTC":"UTC 시각 미확인"));
  top.append(el("span","",r.status));
  card.append(top);
  card.append(el("div","route",
    abbr(r.from)+" → "+abbr(r.to)));
  card.append(el("div","meta",r.asset+" · "+
    (r.amount_display ||
    "raw "+r.amount_raw+" (단위 검증 필요)")));
  card.append(el("div","meta",
    "Block "+r.block+" · "+r.category+" · "+r.source));
  const detail=el("details");
  detail.append(el("summary","","원본 기록 상세"));
  detail.append(el("pre","",JSON.stringify(r,null,2)));
  card.append(detail);
  box.append(card);
 }
 shown+=batch.length;
 more.style.display=shown<filtered.length?"":"none";
 count.textContent="표시 "+shown+" / 검색 "+
 filtered.length+" / 전체 "+all.length+"건";
}
function render(){
 const text=q.value.trim().toLowerCase();
 filtered=all.filter(r=>
  (!s.value||r.status===s.value)&&
  (!a.value||r.asset===a.value)&&
  (!text||[r.utc,r.from,r.to,r.asset,r.asset_contract,
  r.tx_hash,r.unique_id,String(r.block)].some(x=>
    String(x).toLowerCase().includes(text))));
 shown=0;box.replaceChildren();append();
}
q.addEventListener("input",render);
s.addEventListener("change",render);
a.addEventListener("change",render);
more.addEventListener("click",append);
document.getElementById("reset").addEventListener("click",()=>{
 q.value="";s.value="";a.value="";render();
});
render();
</script>
